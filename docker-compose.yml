services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ieee_backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-ieee@rait.ac.in}
    networks:
      - ieee_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ieee_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - ieee_network

  nginx:
    image: nginx:alpine
    container_name: ieee_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ieee_network

networks:
  ieee_network:
    driver: bridge

volumes:
  certbot_conf:
  certbot_www:
